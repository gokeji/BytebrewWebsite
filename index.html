<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ByteBrew App Studios</title>
  <meta name="description" content="ByteBrew App Studios">
  <meta name="theme-color" content="#070708">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #070708;
      color: #EDEBE6;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100svh;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Phones held sideways: the page counter-rotates so it stays portrait (set from script). */
    body.locked {
      position: fixed;
      top: 50%;
      left: 50%;
      width: var(--page-w);
      height: var(--page-h);
      transform: translate(-50%, -50%) rotate(var(--page-rot));
      padding: 20px;
    }

    a { color: #A9A7A2; text-decoration: none; transition: color .4s; }
    a:hover, a:focus-visible { color: #EDEBE6; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .spacer { height: 11px; }

    main {
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: min(560px, 100%, calc((var(--page-h, 100svh) - 190px) * 1.75));
      aspect-ratio: 7 / 4;
      border-radius: 14px;
      background: #0C0C0E;
      border: 1px solid #24242A;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      container-type: inline-size;
    }

    .frames {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .word {
      grid-area: 1 / 1;
      padding: 0.22em 0.16em;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(40px, 11vw, 92px);
      font-size: 16.4cqw;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .w-bytebrew { color: #EDEBE6; }

    .w-app {
      color: transparent;
      background-image: repeating-linear-gradient(180deg, #F0CD96 0 1.6px, transparent 1.6px 5px);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .w-studios {
      color: transparent;
      -webkit-text-stroke: 1.5px #C9A27A;
    }

    .ridges {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 9px);
    }

    .sheen {
      position: absolute;
      inset: 0;
      background-size: 260% 260%;
      background-position: 50% 50%;
      background-repeat: no-repeat;
    }

    .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .edge {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
    }

    .labels {
      position: absolute;
      left: 4.3cqw;
      bottom: 3.2cqw;
      display: flex;
      gap: 14px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .labels span { color: #5E5E63; transition: color .3s; }
    .labels span.on { color: #EDEBE6; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8C8C91;
    }

    .tilt-btn {
      min-height: 44px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid #3A3A3E;
      border-radius: 22px;
      color: #A9A7A2;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .tilt-btn[hidden] { display: none; }
  </style>
</head>

<body>
  <h1 class="sr-only">ByteBrew App Studios</h1>
  <span class="spacer" aria-hidden="true"></span>

  <main>
    <div class="card" id="card" aria-hidden="true">
      <div class="frames">
        <span class="word w-bytebrew" data-frame="0">ByteBrew</span>
        <span class="word w-app" data-frame="1">App</span>
        <span class="word w-studios" data-frame="2">Studios</span>
      </div>
      <div class="ridges"></div>
      <div class="sheen" id="sheen"></div>
      <div class="glare" id="glare"></div>
      <div class="edge" id="edge"></div>
      <div class="labels">
        <span data-label="0">ByteBrew</span>
        <span data-label="1">App</span>
        <span data-label="2">Studios</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="mailto:info@bytebrew.xyz">info@bytebrew.xyz</a>
    <button type="button" class="tilt-btn" id="tilt-btn" hidden>Enable tilt</button>
    <span>&copy; <span id="year">2026</span> ByteBrew LLC</span>
  </footer>

  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();

      var TILT = 20;        // max card tilt in degrees from mouse / touch
      var PHONE_NUDGE = 0.25; // how much phone tilt moves the card itself
      var SNAP = 4.5;       // how quickly each word snaps in
      var PERIOD = 9;       // lenticular strip width in px

      var root = document.documentElement;
      var body = document.body;
      var card = document.getElementById('card');
      var sheen = document.getElementById('sheen');
      var glare = document.getElementById('glare');
      var edge = document.getElementById('edge');
      var app = document.querySelector('.w-app');
      var frames = Array.prototype.slice.call(document.querySelectorAll('[data-frame]'));
      var labels = Array.prototype.slice.call(document.querySelectorAll('[data-label]'));
      var btn = document.getElementById('tilt-btn');

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canHover = !window.matchMedia || window.matchMedia('(hover: hover)').matches;
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      /* ---------- Keep the page portrait when a phone turns sideways ---------- */
      var rot = 0;
      function screenAngle() {
        if (typeof window.orientation === 'number') return window.orientation;
        var a = screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : 0;
        return a > 180 ? a - 360 : a;
      }
      function layout() {
        var a = coarse && !canHover ? screenAngle() : 0;
        rot = (a === 90 || a === -90) ? a : 0;
        var w = window.innerWidth, h = window.innerHeight;
        if (rot) {
          body.classList.add('locked');
          root.style.setProperty('--page-w', h + 'px');
          root.style.setProperty('--page-h', w + 'px');
          root.style.setProperty('--page-rot', (-rot) + 'deg');
        } else {
          body.classList.remove('locked');
          root.style.setProperty('--page-h', h + 'px');
        }
      }
      layout();
      window.addEventListener('resize', layout);
      window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', layout);

      // Screen coordinates -> page coordinates in -1..1, accounting for counter-rotation.
      function toPage(cx, cy) {
        var w = window.innerWidth, h = window.innerHeight;
        if (!rot) return [cx / w * 2 - 1, cy / h * 2 - 1];
        var dx = cx - w / 2, dy = cy - h / 2;
        var th = rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
        var lx = dx * c - dy * s, ly = dx * s + dy * c;
        return [lx / (h / 2), ly / (w / 2)];
      }

      /* ---------- Inputs ---------- */
      // Pointer (mouse on desktop, finger on phones): tilts the card and drives the effects.
      var pointer = { x: 0, y: 0 };
      var lastPointer = 0;
      var touching = false;
      var lastType = 'mouse';

      function setPointer(e) {
        var p = toPage(e.clientX, e.clientY);
        pointer.x = clamp(p[0], -1, 1);
        pointer.y = clamp(p[1], -1, 1);
        lastPointer = performance.now();
      }
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' && !canHover) return;
        setPointer(e);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) {
        lastType = e.pointerType;
        if (e.target.closest && e.target.closest('a, button')) return;
        if (e.pointerType !== 'mouse') touching = true;
        setPointer(e);
      }, { passive: true });
      function release(e) {
        if (e.pointerType !== 'mouse') { touching = false; lastPointer = performance.now(); }
      }
      window.addEventListener('pointerup', release, { passive: true });
      window.addEventListener('pointercancel', release, { passive: true });

      // Phone tilt: drives the light and the words, and nudges the card a little.
      var tilt = { x: 0, y: 0, rawX: 0 };
      var hasTilt = false;
      var betaRest = null;
      var upsideDown = false;

      window.addEventListener('deviceorientation', function (e) {
        if (e.gamma == null || e.beta == null) return;
        if (!hasTilt) { hasTilt = true; btn.hidden = true; }

        // Held upside down (top of the phone pointing at the floor)?
        var nowUpside = upsideDown ? (e.beta < -15 && e.beta > -165) : (e.beta < -35 && e.beta > -150);
        if (nowUpside !== upsideDown) { upsideDown = nowUpside; betaRest = e.beta; }

        if (betaRest === null) betaRest = e.beta;
        betaRest += (e.beta - betaRest) * 0.004;   // "level" slowly follows how the phone is held

        var sign = upsideDown ? -1 : 1;
        tilt.rawX = sign * e.gamma / 40;           // unclamped, so the words keep cycling
        tilt.x = clamp(tilt.rawX, -1, 1);
        tilt.y = clamp(sign * (e.beta - betaRest) / 20, -1, 1);
      });

      // Shakes: the card has inertia, so a jolt of the phone throws it the other way.
      var gPrev = null;
      window.addEventListener('devicemotion', function (e) {
        var a = e.acceleration;
        var ax, ay;
        if (a && a.x != null) { ax = a.x; ay = a.y; }
        else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
          var g = e.accelerationIncludingGravity;
          if (!gPrev) gPrev = { x: g.x, y: g.y };
          gPrev.x += (g.x - gPrev.x) * 0.1; gPrev.y += (g.y - gPrev.y) * 0.1;
          ax = g.x - gPrev.x; ay = g.y - gPrev.y;
        } else return;
        var mag = Math.sqrt(ax * ax + ay * ay);
        if (mag < 1.2 || reduced) return;            // ignore hand tremor
        var s = upsideDown ? -1 : 1;
        var dt = (e.interval ? (e.interval > 1 ? e.interval / 1000 : e.interval) : 0.016);
        shake.vx += -s * ax * 2200 * dt;
        shake.vy += s * ay * 2200 * dt;
        spin.v += s * ax * 320 * dt;
        pose.vx += -s * ax * 6 * dt;
        pose.vy += s * ay * 6 * dt;
      });

      // iOS needs a tap before it shares motion data. Only ask if it isn't already coming through.
      var DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
      if (DOE && typeof DOE.requestPermission === 'function' && 'ontouchstart' in window) {
        setTimeout(function () { if (!hasTilt) btn.hidden = false; }, 1200);
        btn.addEventListener('click', function () {
          var asks = [DOE.requestPermission()];
          if (DME && typeof DME.requestPermission === 'function') asks.push(DME.requestPermission());
          Promise.all(asks).then(function (res) {
            if (res[0] === 'granted') btn.hidden = true;
          }).catch(function () {});
        });
      }

      /* ---------- Physics: damped springs ---------- */
      // pose: card tilt (-1..1), shake: card offset (px), spin: in-plane wobble (deg), flip: upside-down turn (deg)
      var pose = { x: 0, y: 0, vx: 0, vy: 0 };
      var shake = { x: 0, y: 0, vx: 0, vy: 0 };
      var spin = { a: 0, v: 0 };
      var flip = { a: 0, v: 0 };
      var tiltFx = { x: 0, y: 0, rawX: 0 };

      function spring(pos, vel, target, k, zeta, dt) {
        var c = 2 * zeta * Math.sqrt(k);
        vel += (k * (target - pos) - c * vel) * dt;
        pos += vel * dt;
        return [pos, vel];
      }

      function step(dt) {
        var z = reduced ? 1 : 0.5;
        var tx = pointer.x + (hasTilt ? tilt.x * PHONE_NUDGE : 0);
        var ty = pointer.y + (hasTilt ? tilt.y * PHONE_NUDGE : 0);
        var r = spring(pose.x, pose.vx, tx, 70, z, dt); pose.x = r[0]; pose.vx = r[1];
        r = spring(pose.y, pose.vy, ty, 70, z, dt); pose.y = r[0]; pose.vy = r[1];

        r = spring(shake.x, shake.vx, 0, 160, 0.16, dt); shake.x = clamp(r[0], -70, 70); shake.vx = r[1];
        r = spring(shake.y, shake.vy, 0, 160, 0.16, dt); shake.y = clamp(r[0], -70, 70); shake.vy = r[1];
        r = spring(spin.a, spin.v, 0, 120, 0.14, dt); spin.a = clamp(r[0], -28, 28); spin.v = r[1];
        r = spring(flip.a, flip.v, upsideDown ? 180 : 0, 38, reduced ? 1 : 0.42, dt); flip.a = r[0]; flip.v = r[1];

        var f = 1 - Math.exp(-dt * 8);
        tiltFx.x += ((hasTilt ? tilt.x : 0) - tiltFx.x) * f;
        tiltFx.y += ((hasTilt ? tilt.y : 0) - tiltFx.y) * f;
        tiltFx.rawX += ((hasTilt ? tilt.rawX : 0) - tiltFx.rawX) * f;
      }

      /* ---------- Rendering ---------- */
      var lastTop = -1;

      function render() {
        var lift = Math.sin(flip.a * Math.PI / 180) * 32;   // the card arcs toward you while flipping
        card.style.transform =
          'translate3d(' + shake.x.toFixed(1) + 'px,' + (shake.y + pose.y * 28).toFixed(1) + 'px,0) ' +
          'rotateZ(' + (flip.a + spin.a).toFixed(2) + 'deg) ' +
          'rotateX(' + lift.toFixed(2) + 'deg) ' +
          'rotateY(' + (pose.x * TILT).toFixed(2) + 'deg) ' +
          'rotateX(' + (-pose.y * TILT * 1.25).toFixed(2) + 'deg)';

        // Light follows the card pose plus phone tilt.
        var x = clamp(pose.x + tiltFx.x, -1, 1);
        var y = clamp(pose.y + tiltFx.y, -1, 1);

        sheen.style.backgroundImage = 'linear-gradient(' + (105 + y * 35).toFixed(1) + 'deg, transparent 40%, rgba(255,255,255,' +
          (0.07 + Math.abs(y) * 0.06).toFixed(3) + ') 50%, transparent 60%)';
        sheen.style.backgroundPosition = clamp(50 - x * 60, 0, 100).toFixed(1) + '% ' + clamp(50 - y * 60, 0, 100).toFixed(1) + '%';

        glare.style.background = 'radial-gradient(ellipse 75% 65% at ' + (50 - x * 45).toFixed(1) + '% ' +
          (50 - y * 85).toFixed(1) + '%, rgba(240,205,150,' + (0.06 + Math.abs(y) * 0.07).toFixed(3) + '), transparent 70%)';

        var topLight = 0.04 + Math.max(0, -y) * 0.24;
        var bottomLight = 0.03 + Math.max(0, y) * 0.2;
        edge.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,' + topLight.toFixed(3) + '), inset 0 -1px 0 rgba(255,255,255,' + bottomLight.toFixed(3) + ')';

        app.style.backgroundPosition = '0 ' + (y * 6).toFixed(2) + 'px';

        // Lenticular words sit on a loop: ByteBrew -> App -> Studios -> ByteBrew ...
        var phase = 1 / 3 + (pose.x + tiltFx.rawX) * (2 / 3);
        phase = phase - Math.floor(phase);
        var w = [0, 1 / 3, 2 / 3].map(function (c) {
          var d = Math.abs(phase - c); d = Math.min(d, 1 - d);
          return Math.max(0, 1 - d * SNAP);
        });
        var sum = (w[0] + w[1] + w[2]) || 1;
        var start = 0;
        frames.forEach(function (el, i) {
          var a = PERIOD * w[i] / sum, s = start, e = start + a;
          start = e;
          var m = 'repeating-linear-gradient(90deg, transparent 0 ' + s.toFixed(2) + 'px, #000 ' +
            s.toFixed(2) + 'px ' + e.toFixed(2) + 'px, transparent ' + e.toFixed(2) + 'px ' + PERIOD + 'px)';
          el.style.webkitMaskImage = m;
          el.style.maskImage = m;
        });

        var top = w.indexOf(Math.max(w[0], w[1], w[2]));
        if (top !== lastTop) {
          labels.forEach(function (el, i) { el.classList.toggle('on', i === top); });
          lastTop = top;
        }
      }

      var lastNow = performance.now();
      var lastKey = '';

      function tick(now) {
        var dt = clamp((now - lastNow) / 1000, 0, 1 / 20);
        lastNow = now;

        var touchMode = !canHover || lastType !== 'mouse';
        if (touchMode && !touching && now - lastPointer > 3000 && (hasTilt || reduced)) {
          // On phones, a few seconds after the finger lifts the card settles back to centre.
          pointer.x = 0; pointer.y = 0;
        } else if (!reduced && !hasTilt && !touching && now - lastPointer > 2500) {
          // With no input at all, drift gently so the card never looks frozen.
          pointer.x = Math.sin(now * 0.00028) * 0.9;
          pointer.y = Math.sin(now * 0.00023 + 1) * 0.6;
        }

        // Two sub-steps keep the springs stable at low frame rates.
        step(dt / 2); step(dt / 2);

        var key = [pose.x, pose.y, shake.x, shake.y, spin.a, flip.a, tiltFx.x, tiltFx.y, tiltFx.rawX]
          .map(function (v) { return v.toFixed(3); }).join(',');
        if (key !== lastKey) { lastKey = key; render(); }
        requestAnimationFrame(tick);
      }

      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>

</html>
