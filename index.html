<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ByteBrew App Studios</title>
  <meta name="description" content="ByteBrew App Studios">
  <meta name="theme-color" content="#070708">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #070708;
      color: #EDEBE6;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100svh;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Phones held sideways: the page counter-rotates so it stays portrait (set from script). */
    body.locked {
      position: fixed;
      top: 50%;
      left: 50%;
      width: var(--page-w);
      height: var(--page-h);
      transform: translate(-50%, -50%) rotate(var(--page-rot));
      padding: 20px;
    }

    a { color: #A9A7A2; text-decoration: none; transition: color .4s; }
    a:hover, a:focus-visible { color: #EDEBE6; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .spacer { height: 11px; }

    main {
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .card {
      position: relative;
      /* small enough to spin freely inside the page at any angle */
      width: min(560px, calc((var(--page-w, 100vw) - 8px) / 1.16), calc((var(--page-h, 100svh) - 190px) * 1.75));
      aspect-ratio: 7 / 4;
      border-radius: 14px;
      background: #0C0C0E;
      border: 1px solid #24242A;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      container-type: inline-size;
    }

    .frames {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .word {
      grid-area: 1 / 1;
      padding: 0.22em 0.16em;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(40px, 11vw, 92px);
      font-size: 16.4cqw;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .w-bytebrew { color: #EDEBE6; }

    .w-app {
      color: transparent;
      background-image: repeating-linear-gradient(180deg, #F0CD96 0 1.6px, transparent 1.6px 5px);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .w-studios {
      color: transparent;
      -webkit-text-stroke: 1.5px #C9A27A;
    }

    .ridges {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 9px);
    }

    .sheen {
      position: absolute;
      inset: 0;
      background-size: 260% 260%;
      background-position: 50% 50%;
      background-repeat: no-repeat;
    }

    .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .edge {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
    }

    .labels {
      position: absolute;
      left: 4.3cqw;
      bottom: 3.2cqw;
      display: flex;
      gap: 14px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .labels span { color: #5E5E63; transition: color .3s; }
    .labels span.on { color: #EDEBE6; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8C8C91;
    }

    .tilt-btn {
      min-height: 44px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid #3A3A3E;
      border-radius: 22px;
      color: #A9A7A2;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .tilt-btn[hidden] { display: none; }
  </style>
</head>

<body>
  <h1 class="sr-only">ByteBrew App Studios</h1>
  <span class="spacer" aria-hidden="true"></span>

  <main>
    <div class="card" id="card" aria-hidden="true">
      <div class="frames">
        <span class="word w-bytebrew" data-frame="0">ByteBrew</span>
        <span class="word w-app" data-frame="1">App</span>
        <span class="word w-studios" data-frame="2">Studios</span>
      </div>
      <div class="ridges"></div>
      <div class="sheen" id="sheen"></div>
      <div class="glare" id="glare"></div>
      <div class="edge" id="edge"></div>
      <div class="labels">
        <span data-label="0">ByteBrew</span>
        <span data-label="1">App</span>
        <span data-label="2">Studios</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="mailto:info@bytebrew.xyz">info@bytebrew.xyz</a>
    <button type="button" class="tilt-btn" id="tilt-btn" hidden>Enable tilt</button>
    <span>&copy; <span id="year">2026</span> ByteBrew LLC</span>
  </footer>

  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();

      /* ================= Tuning ================= */
      var TILT = 20;            // card tilt (deg) at full pointer deflection
      var SNAP = 4.5;           // how quickly each lenticular word snaps in
      var PERIOD = 9;           // lenticular strip width (px)
      var YAW_PER_LOOP = 100;   // degrees of turning the phone for one full ByteBrew -> App -> Studios loop

      var SPIN_K = 90;          // spring holding the card's angle (higher = snappier)
      var SPIN_ZETA = 0.38;     // damping: a little overshoot, then it settles
      var LEAN = 0.12;          // how much the card leans with small rolls of the phone
      var LEAN_MAX = 5;         // max lean (deg) before it snaps to the next quarter turn
      var SNAP_AT = 60;         // roll past a quarter turn by this many degrees to snap over
      var SHAKE_SPIN = 150;     // wobble from a shake
      var SHAKE_MIN = 2.5;      // m/s^2: ignore ordinary hand movement
      var TWIST_COUPLE = 0.35;  // momentary lag when the phone is twisted quickly
      var TILT_COUPLE = 0.12;   // momentary 3D lag when the phone is tilted quickly
      var NUDGE = 0.06;         // how much ordinary tilting moves the card itself (keep tiny)
      var BOUNCE_GAIN = 90;     // lateral bounce from jolts (kept small on purpose)
      var DEPTH_GAIN = 260;     // toward/away bounce from jolts
      var FLICK_GAIN = 380;     // spin from flicking across the card with a finger or mouse

      var root = document.documentElement;
      var body = document.body;
      var card = document.getElementById('card');
      var sheen = document.getElementById('sheen');
      var glare = document.getElementById('glare');
      var edge = document.getElementById('edge');
      var app = document.querySelector('.w-app');
      var frames = Array.prototype.slice.call(document.querySelectorAll('[data-frame]'));
      var labels = Array.prototype.slice.call(document.querySelectorAll('[data-label]'));
      var btn = document.getElementById('tilt-btn');

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canHover = !window.matchMedia || window.matchMedia('(hover: hover)').matches;
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var DEG = Math.PI / 180;

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      /* ================= Keep the page portrait on phones ================= */
      var rot = 0;
      function screenAngle() {
        if (typeof window.orientation === 'number') return window.orientation;
        var a = screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : 0;
        return a > 180 ? a - 360 : a;
      }
      function layout() {
        var a = coarse && !canHover ? screenAngle() : 0;
        rot = (a === 90 || a === -90) ? a : 0;
        var w = window.innerWidth, h = window.innerHeight;
        if (rot) {
          body.classList.add('locked');
          root.style.setProperty('--page-w', h + 'px');
          root.style.setProperty('--page-h', w + 'px');
          root.style.setProperty('--page-rot', (-rot) + 'deg');
        } else {
          body.classList.remove('locked');
          root.style.setProperty('--page-w', w + 'px');
          root.style.setProperty('--page-h', h + 'px');
        }
      }
      layout();
      window.addEventListener('resize', layout);
      window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', layout);

      // Screen point -> page coordinates in -1..1 (x right, y down), undoing the counter-rotation.
      function toPage(cx, cy) {
        var w = window.innerWidth, h = window.innerHeight;
        if (!rot) return [cx / w * 2 - 1, cy / h * 2 - 1];
        var dx = cx - w / 2, dy = cy - h / 2;
        var c = Math.cos(rot * DEG), s = Math.sin(rot * DEG);
        return [(dx * c - dy * s) / (h / 2), (dx * s + dy * c) / (w / 2)];
      }

      /* ================= Card state ================= */
      var pose = { x: 0, y: 0, vx: 0, vy: 0 };          // 3D tilt of the card in its own frame (-1..1)
      var spin = { a: 0, v: 0 };                         // in-plane angle (deg, clockwise) and speed (deg/s)
      var snapAngle = 0, lean = 0;
      var bob = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }; // small positional bounce (px)

      /* ================= Pointer: mouse & touch ================= */
      var pointer = { x: 0, y: 0 };
      var lastPointer = 0, touching = false, lastType = 'mouse';
      var prevP = null;

      function cardCenter() {
        var r = card.getBoundingClientRect();
        return toPage(r.left + r.width / 2, r.top + r.height / 2);
      }

      function setPointer(e) {
        var p = toPage(e.clientX, e.clientY);
        var now = performance.now();
        // Flicking across the card spins it, like brushing a hanging card with your hand.
        if (prevP && !reduced) {
          var dt = (now - prevP.t) / 1000;
          if (dt > 0.004 && dt < 0.1) {
            var vx = (p[0] - prevP.x) / dt, vy = (p[1] - prevP.y) / dt;
            var speed = Math.sqrt(vx * vx + vy * vy);
            if (speed > 1.2) {
              var c = cardCenter();
              var rx = p[0] - c[0], ry = p[1] - c[1];
              var near = Math.exp(-(rx * rx + ry * ry) / 0.25);
              spin.v = clamp(spin.v + (rx * vy - ry * vx) * FLICK_GAIN * near * dt * 8, -1400, 1400);
            }
          }
        }
        prevP = { x: p[0], y: p[1], t: now };
        pointer.x = clamp(p[0], -1, 1);
        pointer.y = clamp(p[1], -1, 1);
        lastPointer = now;
      }
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' && !canHover) return;
        setPointer(e);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) {
        lastType = e.pointerType;
        if (e.target.closest && e.target.closest('a, button')) return;
        prevP = null;
        if (e.pointerType !== 'mouse') touching = true;
        setPointer(e);
      }, { passive: true });
      function release(e) {
        if (e.pointerType !== 'mouse') { touching = false; lastPointer = performance.now(); prevP = null; }
      }
      window.addEventListener('pointerup', release, { passive: true });
      window.addEventListener('pointercancel', release, { passive: true });

      /* ================= Phone sensors ================= */
      var S = {
        up: { x: 0, y: 1, z: 0 },   // effective "up" in device axes (gravity + motion), in g
        hasUp: false,
        accSign: /iPhone|iPad|iPod/.test(navigator.userAgent) ? -1 : 1,  // platforms disagree; calibrated below
        accVotes: 0,
        rateSign: 1, rateVotes: 0, hasRate: false,
        om: { x: 0, y: 0, z: 0 },   // device rotation rate (deg/s)
        yaw: 0,                     // accumulated left/right turning (card frame, deg) -> lenticular loop
        yawLeak: 0, pitchLeak: 0,   // recent turning, fades out -> light + slight card nudge
        active: false
      };
      var upO = null, upOPrev = null, upOT = 0, lastAig = null;

      // Feed a device rotation rate (deg/s, device axes) into the card: integrate turning,
      // and let sudden changes in rotation make the card lag (it has inertia).
      function feedRotation(ox, oy, oz, dt) {
        var th = spin.a * DEG, c = Math.cos(th), s = Math.sin(th);
        var cx = ox * c - oy * s;           // rate about the card's horizontal axis
        var cy = ox * s + oy * c;           // rate about the card's vertical axis
        var dcx = cx - (S.ocx || 0), dcy = cy - (S.ocy || 0), dz = oz - S.om.z;
        S.ocx = cx; S.ocy = cy; S.om.x = ox; S.om.y = oy; S.om.z = oz;

        S.yaw += cy * dt;
        var leak = Math.exp(-dt / 2.5);
        S.yawLeak = S.yawLeak * leak + cy * dt;
        S.pitchLeak = S.pitchLeak * leak + cx * dt;

        if (!reduced) {
          // Only sudden changes register, so ordinary handling leaves the card still.
          if (Math.abs(dz) > 40) spin.v = clamp(spin.v + dz * TWIST_COUPLE, -600, 600);
          if (Math.abs(dcy) > 40) pose.vx += -dcy / TILT * TILT_COUPLE;
          if (Math.abs(dcx) > 40) pose.vy += -dcx / (TILT * 1.25) * TILT_COUPLE;
        }
      }

      window.addEventListener('devicemotion', function (e) {
        var dt = e.interval ? (e.interval > 1 ? e.interval / 1000 : e.interval) : 0.016;
        dt = clamp(dt, 0.004, 0.1);
        var g = e.accelerationIncludingGravity;
        if (g && g.x != null) {
          S.active = true; btn.hidden = true;
          lastAig = { x: g.x, y: g.y, z: g.z };
          var k = S.accSign / 9.81;
          var tx = g.x * k, ty = g.y * k, tz = g.z * k;
          var f = S.hasUp ? 0.55 : 1;
          S.up.x += (tx - S.up.x) * f; S.up.y += (ty - S.up.y) * f; S.up.z += (tz - S.up.z) * f;
          S.hasUp = true;
        }
        var a = e.acceleration;
        if (a && a.x != null && !reduced) {
          var sg = S.accSign;
          var amag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
          if (amag > SHAKE_MIN) {
            // A shake makes the card wobble around its centre, then settle,
            // with a small bounce (mostly toward/away from you).
            spin.v = clamp(spin.v + (-a.x * sg) * SHAKE_SPIN * dt, -600, 600);
            bob.vx += -a.x * sg * BOUNCE_GAIN * dt;
            bob.vy += a.y * sg * BOUNCE_GAIN * dt;
            bob.vz += -a.z * sg * DEPTH_GAIN * dt;
          }
        }
        var r = e.rotationRate;
        if (r && r.alpha != null) {
          S.hasRate = true;
          var rs = S.rateSign;
          S.rawRate = { x: r.beta, y: r.gamma, z: r.alpha };
          feedRotation(r.beta * rs, r.gamma * rs, r.alpha * rs, dt);
        }
      });

      window.addEventListener('deviceorientation', function (e) {
        if (e.beta == null || e.gamma == null) return;
        S.active = true; btn.hidden = true;
        var b = e.beta * DEG, gm = e.gamma * DEG;
        // "Up" in device axes from orientation (consistent across browsers).
        upO = { x: -Math.sin(gm) * Math.cos(b), y: Math.sin(b), z: Math.cos(gm) * Math.cos(b) };
        var now = performance.now();

        if (!S.hasUp) { S.up.x = upO.x; S.up.y = upO.y; S.up.z = upO.z; }

        // Calibrate the accelerometer's sign convention against orientation.
        if (lastAig) {
          var mag = Math.sqrt(lastAig.x * lastAig.x + lastAig.y * lastAig.y + lastAig.z * lastAig.z);
          if (mag > 7 && mag < 12.5) {
            var d = (lastAig.x * upO.x + lastAig.y * upO.y + lastAig.z * upO.z) / mag;
            if (Math.abs(d) > 0.6) {
              S.accVotes = clamp(S.accVotes + (d > 0 ? 1 : -1), -20, 20);
              if (Math.abs(S.accVotes) > 4) S.accSign = S.accVotes > 0 ? 1 : -1;
            }
          }
        }

        if (upOPrev) {
          var dt = clamp((now - upOT) / 1000, 0.004, 0.2);
          if (S.hasRate && S.rawRate) {
            // Calibrate the gyroscope's sign: a world-fixed "up" turns opposite to the phone.
            var w = { x: S.rawRate.x * DEG, y: S.rawRate.y * DEG, z: S.rawRate.z * DEG };
            var px = -(w.y * upOPrev.z - w.z * upOPrev.y), py = -(w.z * upOPrev.x - w.x * upOPrev.z), pz = -(w.x * upOPrev.y - w.y * upOPrev.x);
            var ax = upO.x - upOPrev.x, ay = upO.y - upOPrev.y, az = upO.z - upOPrev.z;
            var corr = px * ax + py * ay + pz * az;
            if (Math.abs(corr) > 1e-4 / dt) {
              S.rateVotes = clamp(S.rateVotes + (corr > 0 ? 1 : -1), -20, 20);
              if (Math.abs(S.rateVotes) > 4) S.rateSign = S.rateVotes > 0 ? 1 : -1;
            }
          } else if (!S.hasRate) {
            // No gyroscope: estimate turning from orientation changes instead.
            var db = e.beta - S.prevBeta, dg = e.gamma - S.prevGamma;
            if (Math.abs(db) < 60 && Math.abs(dg) < 60) feedRotation(db / dt, dg / dt, 0, dt);
          }
        }
        S.prevBeta = e.beta; S.prevGamma = e.gamma;
        upOPrev = upO; upOT = now;
      });

      // iOS needs a tap before sharing motion data. Only ask if nothing is coming through yet.
      var DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
      var needsAsk = (DOE && typeof DOE.requestPermission === 'function') || (DME && typeof DME.requestPermission === 'function');
      if (needsAsk && 'ontouchstart' in window) {
        setTimeout(function () { if (!S.active) btn.hidden = false; }, 1200);
        btn.addEventListener('click', function () {
          var asks = [];
          if (DME && DME.requestPermission) asks.push(DME.requestPermission());
          if (DOE && DOE.requestPermission) asks.push(DOE.requestPermission());
          Promise.all(asks).then(function (res) {
            if (res.indexOf('granted') !== -1) btn.hidden = true;
          }).catch(function () {});
        });
      }

      /* ================= Physics ================= */
      function spring(pos, vel, target, k, zeta, dt) {
        var c = 2 * zeta * Math.sqrt(k);
        vel += (k * (target - pos) - c * vel) * dt;
        return [pos + vel * dt, vel];
      }

      function step(dt) {
        // 1) In-plane: the card stays put, leaning only slightly as the phone rolls.
        //    Roll the phone past a quarter turn and it springs round to the nearest 90 degrees.
        if (S.hasUp) {
          var ex = S.up.x, ey = S.up.y;
          if (ex * ex + ey * ey > 0.25) {            // ignore when the phone is lying nearly flat
            var phi = Math.atan2(ex, ey) / DEG;
            var off = ((phi - snapAngle) % 360 + 540) % 360 - 180;
            if (Math.abs(off) > 45 + (SNAP_AT - 45)) snapAngle = Math.round(phi / 90) * 90;
            off = ((phi - snapAngle) % 360 + 540) % 360 - 180;
            lean = clamp(off * LEAN, -LEAN_MAX, LEAN_MAX);
          }
        }
        var goal = snapAngle + lean;
        goal += 360 * Math.round((spin.a - goal) / 360);   // turn the short way round
        var zr = reduced ? 1 : SPIN_ZETA;
        var rr = spring(spin.a, spin.v, goal, SPIN_K, zr, dt); spin.a = rr[0]; spin.v = rr[1];
        if (spin.a > 720 || spin.a < -720) spin.a = spin.a % 360;

        // 2) 3D tilt: follows the pointer (rotated into the card's frame), plus a slight nudge
        //    from recent phone turning, with springy momentum.
        var th = spin.a * DEG, c = Math.cos(th), s = Math.sin(th);
        var px = pointer.x * c + pointer.y * s;
        var py = -pointer.x * s + pointer.y * c;
        var tx = px + clamp(S.yawLeak / 30, -1, 1) * NUDGE;
        var ty = py + clamp(S.pitchLeak / 25, -1, 1) * NUDGE;
        var z = reduced ? 1 : 0.45;
        var r = spring(pose.x, pose.vx, tx, 70, z, dt); pose.x = clamp(r[0], -1.6, 1.6); pose.vx = r[1];
        r = spring(pose.y, pose.vy, ty, 70, z, dt); pose.y = clamp(r[0], -1.6, 1.6); pose.vy = r[1];

        // 3) Small bounce from jolts.
        r = spring(bob.x, bob.vx, 0, 220, 0.3, dt); bob.x = clamp(r[0], -12, 12); bob.vx = r[1];
        r = spring(bob.y, bob.vy, 0, 220, 0.3, dt); bob.y = clamp(r[0], -12, 12); bob.vy = r[1];
        r = spring(bob.z, bob.vz, 0, 160, 0.28, dt); bob.z = clamp(r[0], -60, 60); bob.vz = r[1];
      }

      /* ================= Rendering ================= */
      var lastTop = -1;

      function render() {
        // A card in motion lifts toward you a touch.
        var lift = Math.min(Math.abs(spin.v) * 0.03, 24);
        card.style.transform =
          'translate3d(' + bob.x.toFixed(1) + 'px,' + (bob.y + pose.y * 18).toFixed(1) + 'px,' + (bob.z + lift).toFixed(1) + 'px) ' +
          'rotateZ(' + spin.a.toFixed(2) + 'deg) ' +
          'rotateY(' + (pose.x * TILT).toFixed(2) + 'deg) ' +
          'rotateX(' + (-pose.y * TILT * 1.25).toFixed(2) + 'deg)';

        // Light (in the card's frame): follows the card's tilt and recent phone turning.
        var x = clamp(pose.x + S.yawLeak / 22, -1, 1);
        var y = clamp(pose.y + S.pitchLeak / 18, -1, 1);

        sheen.style.backgroundImage = 'linear-gradient(' + (105 + y * 35).toFixed(1) + 'deg, transparent 40%, rgba(255,255,255,' +
          (0.07 + Math.abs(y) * 0.06).toFixed(3) + ') 50%, transparent 60%)';
        sheen.style.backgroundPosition = clamp(50 - x * 60, 0, 100).toFixed(1) + '% ' + clamp(50 - y * 60, 0, 100).toFixed(1) + '%';

        glare.style.background = 'radial-gradient(ellipse 75% 65% at ' + (50 - x * 45).toFixed(1) + '% ' +
          (50 - y * 85).toFixed(1) + '%, rgba(240,205,150,' + (0.06 + Math.abs(y) * 0.07).toFixed(3) + '), transparent 70%)';

        var topLight = 0.04 + Math.max(0, -y) * 0.24;
        var bottomLight = 0.03 + Math.max(0, y) * 0.2;
        edge.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,' + topLight.toFixed(3) + '), inset 0 -1px 0 rgba(255,255,255,' + bottomLight.toFixed(3) + ')';

        app.style.backgroundPosition = '0 ' + (y * 6).toFixed(2) + 'px';

        // Lenticular words on a loop: ByteBrew -> App -> Studios -> ByteBrew ...
        // On phones the viewing angle is the phone's turn plus the card's own tilt (in degrees);
        // with a mouse, the card's tilt alone sweeps the words.
        var phase = S.active
          ? 1 / 3 + (S.yaw + pose.x * TILT) / YAW_PER_LOOP + pointer.x * 0.25
          : 1 / 3 + pose.x * (2 / 3);
        phase = phase - Math.floor(phase);
        var w = [0, 1 / 3, 2 / 3].map(function (c) {
          var d = Math.abs(phase - c); d = Math.min(d, 1 - d);
          return Math.max(0, 1 - d * SNAP);
        });
        var sum = (w[0] + w[1] + w[2]) || 1;
        var start = 0;
        frames.forEach(function (el, i) {
          var a = PERIOD * w[i] / sum, s = start, e = start + a;
          start = e;
          var m = 'repeating-linear-gradient(90deg, transparent 0 ' + s.toFixed(2) + 'px, #000 ' +
            s.toFixed(2) + 'px ' + e.toFixed(2) + 'px, transparent ' + e.toFixed(2) + 'px ' + PERIOD + 'px)';
          el.style.webkitMaskImage = m;
          el.style.maskImage = m;
        });

        var top = w.indexOf(Math.max(w[0], w[1], w[2]));
        if (top !== lastTop) {
          labels.forEach(function (el, i) { el.classList.toggle('on', i === top); });
          lastTop = top;
        }
      }

      var lastNow = performance.now();
      var lastKey = '';

      function tick(now) {
        var dt = clamp((now - lastNow) / 1000, 0, 1 / 20);
        lastNow = now;

        var touchMode = !canHover || lastType !== 'mouse';
        if (touchMode && !touching && now - lastPointer > 3000 && (S.active || reduced)) {
          // On phones, a few seconds after the finger lifts the card settles back.
          pointer.x = 0; pointer.y = 0;
        } else if (!reduced && !S.active && !touching && now - lastPointer > 2500) {
          // No input at all: drift gently so the card never looks frozen.
          pointer.x = Math.sin(now * 0.00028) * 0.9;
          pointer.y = Math.sin(now * 0.00023 + 1) * 0.6;
        }

        // Without sensor events, let recent-turn values fade on their own.
        if (!S.active) { S.yawLeak *= 0.98; S.pitchLeak *= 0.98; }

        for (var i = 0; i < 4; i++) step(dt / 4);

        var key = [pose.x, pose.y, spin.a, bob.x, bob.y, bob.z, S.yaw, S.yawLeak, S.pitchLeak]
          .map(function (v) { return v.toFixed(2); }).join(',');
        if (key !== lastKey) { lastKey = key; render(); }
        requestAnimationFrame(tick);
      }

      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>

</html>
