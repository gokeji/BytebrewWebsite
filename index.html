<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteBrew App Studios</title>
  <meta name="description" content="ByteBrew App Studios">
  <meta name="theme-color" content="#070708">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #070708;
      color: #EDEBE6;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100svh;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
      overflow-x: hidden;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    a { color: #A9A7A2; text-decoration: none; transition: color .4s; }
    a:hover, a:focus-visible { color: #EDEBE6; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .spacer { height: 11px; }

    main {
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: min(560px, 100%, calc((100svh - 190px) * 1.75));
      aspect-ratio: 7 / 4;
      border-radius: 14px;
      background: #0C0C0E;
      border: 1px solid #24242A;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .frames {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .word {
      grid-area: 1 / 1;
      padding: 0.22em 0.16em;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(40px, 11vw, 92px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .w-bytebrew { color: #EDEBE6; }

    .w-app {
      color: transparent;
      background-image: repeating-linear-gradient(180deg, #F0CD96 0 1.6px, transparent 1.6px 5px);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .w-studios {
      color: transparent;
      -webkit-text-stroke: 1.5px #C9A27A;
    }

    .ridges {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 9px);
    }

    .sheen {
      position: absolute;
      inset: 0;
      background-size: 260% 260%;
      background-position: 50% 50%;
      background-repeat: no-repeat;
    }

    .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .edge {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
    }

    .labels {
      position: absolute;
      left: 24px;
      bottom: 18px;
      display: flex;
      gap: 14px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .labels span { color: #5E5E63; transition: color .3s; }
    .labels span.on { color: #EDEBE6; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8C8C91;
    }

    .tilt-btn {
      min-height: 44px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid #3A3A3E;
      border-radius: 22px;
      color: #A9A7A2;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .tilt-btn[hidden] { display: none; }
  </style>
</head>

<body>
  <h1 class="sr-only">ByteBrew App Studios</h1>
  <span class="spacer" aria-hidden="true"></span>

  <main>
    <div class="card" id="card" aria-hidden="true">
      <div class="frames">
        <span class="word w-bytebrew" data-frame="0">ByteBrew</span>
        <span class="word w-app" data-frame="1">App</span>
        <span class="word w-studios" data-frame="2">Studios</span>
      </div>
      <div class="ridges"></div>
      <div class="sheen" id="sheen"></div>
      <div class="glare" id="glare"></div>
      <div class="edge" id="edge"></div>
      <div class="labels">
        <span data-label="0">ByteBrew</span>
        <span data-label="1">App</span>
        <span data-label="2">Studios</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="mailto:info@bytebrew.xyz">info@bytebrew.xyz</a>
    <button type="button" class="tilt-btn" id="tilt-btn" hidden>Enable tilt</button>
    <span>&copy; <span id="year">2026</span> ByteBrew LLC</span>
  </footer>

  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();

      var TILT = 20;      // max card tilt in degrees (mouse / tap)
      var SNAP = 2.6;     // how quickly each word snaps in
      var PERIOD = 9;     // lenticular strip width in px

      var card = document.getElementById('card');
      var sheen = document.getElementById('sheen');
      var glare = document.getElementById('glare');
      var edge = document.getElementById('edge');
      var app = document.querySelector('.w-app');
      var frames = Array.prototype.slice.call(document.querySelectorAll('[data-frame]'));
      var labels = Array.prototype.slice.call(document.querySelectorAll('[data-label]'));
      var btn = document.getElementById('tilt-btn');

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Pointer pose (mouse on desktop, taps on phones): tilts the card AND drives the effects.
      var pointer = { x: 0, y: 0 };
      var cardPose = { x: 0, y: 0 };
      var lastPointer = 0;

      // Phone tilt: drives only the light and the lenticular effect; the card itself stays flat.
      var tilt = { x: 0, y: 0 };
      var tiltPose = { x: 0, y: 0 };
      var hasTilt = false;
      var betaRest = null;

      var lastTop = -1;
      var lastKey = '';

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function setPointer(e) {
        pointer.x = clamp((e.clientX / window.innerWidth) * 2 - 1, -1, 1);
        pointer.y = clamp((e.clientY / window.innerHeight) * 2 - 1, -1, 1);
        lastPointer = performance.now();
      }

      var canHover = !window.matchMedia || window.matchMedia('(hover: hover)').matches;
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' && !canHover) return;
        setPointer(e);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) {
        if (e.target.closest && e.target.closest('a, button')) return;
        setPointer(e);
      }, { passive: true });

      window.addEventListener('deviceorientation', function (e) {
        if (e.gamma == null || e.beta == null) return;
        if (!hasTilt) {
          hasTilt = true;
          btn.hidden = true;
        }
        // Measure forward/back tilt relative to how the phone is being held, adapting slowly.
        if (betaRest === null) betaRest = e.beta;
        betaRest += (e.beta - betaRest) * 0.004;
        tilt.x = clamp(e.gamma / 25, -1, 1);
        tilt.y = clamp((e.beta - betaRest) / 20, -1, 1);
      });

      // iOS needs a tap before it shares motion data. Only ask if tilt isn't already coming through.
      var DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === 'function' && 'ontouchstart' in window) {
        setTimeout(function () { if (!hasTilt) btn.hidden = false; }, 1200);
        btn.addEventListener('click', function () {
          DOE.requestPermission().then(function (res) {
            if (res === 'granted') btn.hidden = true;
          }).catch(function () {});
        });
      }

      function render() {
        // Card tilt follows the pointer only.
        var cx = cardPose.x, cy = cardPose.y;
        card.style.transform =
          'translate3d(0,' + (cy * 28).toFixed(1) + 'px,0) ' +
          'rotateY(' + (cx * TILT).toFixed(2) + 'deg) ' +
          'rotateX(' + (-cy * TILT * 1.25).toFixed(2) + 'deg)';

        // Light and lenticular follow pointer + phone tilt together.
        var x = clamp(cx + tiltPose.x, -1, 1);
        var y = clamp(cy + tiltPose.y, -1, 1);

        sheen.style.backgroundImage = 'linear-gradient(' + (105 + y * 35).toFixed(1) + 'deg, transparent 40%, rgba(255,255,255,' +
          (0.07 + Math.abs(y) * 0.06).toFixed(3) + ') 50%, transparent 60%)';
        sheen.style.backgroundPosition = clamp(50 - x * 60, 0, 100).toFixed(1) + '% ' + clamp(50 - y * 60, 0, 100).toFixed(1) + '%';

        glare.style.background = 'radial-gradient(ellipse 75% 65% at ' + (50 - x * 45).toFixed(1) + '% ' +
          (50 - y * 85).toFixed(1) + '%, rgba(240,205,150,' + (0.06 + Math.abs(y) * 0.07).toFixed(3) + '), transparent 70%)';

        var topLight = 0.04 + Math.max(0, -y) * 0.24;
        var bottomLight = 0.03 + Math.max(0, y) * 0.2;
        edge.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,' + topLight.toFixed(3) + '), inset 0 -1px 0 rgba(255,255,255,' + bottomLight.toFixed(3) + ')';

        app.style.backgroundPosition = '0 ' + (y * 6).toFixed(2) + 'px';

        var t = clamp((x + 1) / 2, 0, 1);
        var centers = [0, 0.5, 1];
        var w = centers.map(function (c) { return Math.max(0, 1 - Math.abs(t - c) * SNAP); });
        var sum = (w[0] + w[1] + w[2]) || 1;
        var start = 0;
        frames.forEach(function (el, i) {
          var a = PERIOD * w[i] / sum, s = start, e = start + a;
          start = e;
          var m = 'repeating-linear-gradient(90deg, transparent 0 ' + s.toFixed(2) + 'px, #000 ' +
            s.toFixed(2) + 'px ' + e.toFixed(2) + 'px, transparent ' + e.toFixed(2) + 'px ' + PERIOD + 'px)';
          el.style.webkitMaskImage = m;
          el.style.maskImage = m;
        });

        var top = w.indexOf(Math.max(w[0], w[1], w[2]));
        if (top !== lastTop) {
          labels.forEach(function (el, i) { el.classList.toggle('on', i === top); });
          lastTop = top;
        }
      }

      function tick(now) {
        // With no input at all, drift gently so the card never looks frozen.
        if (!reduced && !hasTilt && now - lastPointer > 2500) {
          pointer.x = Math.sin(now * 0.00028) * 0.9;
          pointer.y = Math.sin(now * 0.00023 + 1) * 0.6;
        }
        var k = reduced ? 0.2 : 0.09;
        cardPose.x += (pointer.x - cardPose.x) * k;
        cardPose.y += (pointer.y - cardPose.y) * k;
        var tx = hasTilt ? tilt.x : 0, ty = hasTilt ? tilt.y : 0;
        tiltPose.x += (tx - tiltPose.x) * 0.12;
        tiltPose.y += (ty - tiltPose.y) * 0.12;

        var key = cardPose.x.toFixed(3) + ',' + cardPose.y.toFixed(3) + ',' + tiltPose.x.toFixed(3) + ',' + tiltPose.y.toFixed(3);
        if (key !== lastKey) {
          lastKey = key;
          render();
        }
        requestAnimationFrame(tick);
      }

      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>

</html>
