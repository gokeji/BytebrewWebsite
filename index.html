<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteBrew App Studios</title>
  <meta name="description" content="ByteBrew App Studios">
  <meta name="theme-color" content="#070708">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #070708;
      color: #EDEBE6;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100svh;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
      overflow-x: hidden;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Phones held sideways: the page counter-rotates so it stays portrait (set from script). */
    body.locked {
      position: fixed;
      top: 50%;
      left: 50%;
      width: var(--page-w);
      height: var(--page-h);
      transform: translate(-50%, -50%) rotate(var(--page-rot));
      padding: 20px;
    }

    a { color: #A9A7A2; text-decoration: none; transition: color .4s; }
    a:hover, a:focus-visible { color: #EDEBE6; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .spacer { height: 11px; }

    main {
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .card {
      position: relative;
      width: min(560px, 100%, calc((var(--page-h, 100svh) - 190px) * 1.75));
      container-type: inline-size;
      aspect-ratio: 7 / 4;
      border-radius: 14px;
      background: #0C0C0E;
      border: 1px solid #24242A;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .frames {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .word {
      grid-area: 1 / 1;
      padding: 0.22em 0.16em;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(40px, 11vw, 92px);
      font-size: 16.4cqw;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .w-bytebrew { color: #EDEBE6; }

    .w-app {
      color: transparent;
      background-image: repeating-linear-gradient(180deg, #F0CD96 0 1.6px, transparent 1.6px 5px);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .w-studios {
      color: transparent;
      -webkit-text-stroke: 1.5px #C9A27A;
    }

    .ridges {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 9px);
    }

    .sheen {
      position: absolute;
      inset: 0;
      background-size: 260% 260%;
      background-position: 50% 50%;
      background-repeat: no-repeat;
    }

    .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .edge {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
    }

    .labels {
      position: absolute;
      left: 24px;
      bottom: 18px;
      display: flex;
      gap: 14px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .labels span { color: #5E5E63; transition: color .3s; }
    .labels span.on { color: #EDEBE6; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px 32px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8C8C91;
    }

    .tilt-btn {
      min-height: 44px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid #3A3A3E;
      border-radius: 22px;
      color: #A9A7A2;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .tilt-btn[hidden] { display: none; }
  </style>
</head>

<body>
  <h1 class="sr-only">ByteBrew App Studios</h1>
  <span class="spacer" aria-hidden="true"></span>

  <main>
    <div class="card" id="card" aria-hidden="true">
      <div class="frames">
        <span class="word w-bytebrew" data-frame="0">ByteBrew</span>
        <span class="word w-app" data-frame="1">App</span>
        <span class="word w-studios" data-frame="2">Studios</span>
      </div>
      <div class="ridges"></div>
      <div class="sheen" id="sheen"></div>
      <div class="glare" id="glare"></div>
      <div class="edge" id="edge"></div>
      <div class="labels">
        <span data-label="0">ByteBrew</span>
        <span data-label="1">App</span>
        <span data-label="2">Studios</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="mailto:info@bytebrew.xyz">info@bytebrew.xyz</a>
    <button type="button" class="tilt-btn" id="tilt-btn" hidden>Enable tilt</button>
    <span>&copy; <span id="year">2026</span> ByteBrew LLC</span>
  </footer>

  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();

      var TILT = 20;      // max card tilt in degrees (mouse / tap)
      var BLEND = 0.08;   // width of the halfway strip transition between words (words themselves stay clean)
      var PERIOD = 9;     // lenticular strip width in px

      var card = document.getElementById('card');
      var sheen = document.getElementById('sheen');
      var glare = document.getElementById('glare');
      var edge = document.getElementById('edge');
      var app = document.querySelector('.w-app');
      var frames = Array.prototype.slice.call(document.querySelectorAll('[data-frame]'));
      var labels = Array.prototype.slice.call(document.querySelectorAll('[data-label]'));
      var btn = document.getElementById('tilt-btn');

      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Pointer pose (mouse on desktop, taps on phones): tilts the card AND drives the effects.
      var pointer = { x: 0, y: 0 };
      var cardPose = { x: 0, y: 0 };
      var lastPointer = 0;

      // Phone tilt: drives only the light and the lenticular effect; the card itself stays flat.
      var tilt = { x: 0, y: 0, rawX: 0 };   // rawX is unclamped so the words keep cycling as you tilt
      var tiltPose = { x: 0, y: 0 };
      var tiltRaw = 0;
      var hasTilt = false;
      var betaRest = null;

      var lastTop = -1;
      var lastKey = '';

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      var DEG = Math.PI / 180;
      var root = document.documentElement;
      var canHover = !window.matchMedia || window.matchMedia('(hover: hover)').matches;
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

      // Phones turned sideways: counter-rotate the page so it stays portrait.
      var rot = 0;
      function screenAngle() {
        if (typeof window.orientation === 'number') return window.orientation;
        var a = screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : 0;
        return a > 180 ? a - 360 : a;
      }
      function layout() {
        var a = coarse && !canHover ? screenAngle() : 0;
        rot = (a === 90 || a === -90) ? a : 0;
        var w = window.innerWidth, h = window.innerHeight;
        if (rot) {
          document.body.classList.add('locked');
          root.style.setProperty('--page-w', h + 'px');
          root.style.setProperty('--page-h', w + 'px');
          root.style.setProperty('--page-rot', (-rot) + 'deg');
        } else {
          document.body.classList.remove('locked');
          root.style.setProperty('--page-h', h + 'px');
        }
      }
      layout();
      window.addEventListener('resize', layout);
      window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', layout);

      function setPointer(e) {
        var w = window.innerWidth, h = window.innerHeight, px, py;
        if (!rot) { px = e.clientX / w * 2 - 1; py = e.clientY / h * 2 - 1; }
        else {
          var dx = e.clientX - w / 2, dy = e.clientY - h / 2, c = Math.cos(rot * DEG), s = Math.sin(rot * DEG);
          px = (dx * c - dy * s) / (h / 2); py = (dx * s + dy * c) / (w / 2);
        }
        pointer.x = clamp(px, -1, 1);
        pointer.y = clamp(py, -1, 1);
        lastPointer = performance.now();
      }

      // Quarter turns: once the phone is rotated well past 90 degrees, the card turns to stay upright.
      var snapAngle = 0;        // the quarter turn the phone is in now
      var shownSnap = 0;        // the quarter turn the card is heading for (follows after a short beat)
      var snapChangedAt = 0;
      var side = { prev: null, acc: 0, rest: 0, elRest: 0, snap: -1 };   // sideways tilt tracking
      var SNAP_LAG = 150;       // ms: the card "notices" the phone turned, then catches up
      var turn = { a: 0, v: 0 };

      // Shake wobble: the card rocks around its own vertical axis, as if about to flip over.
      var wob = { y: 0, vy: 0, x: 0, vx: 0, z: 0, vz: 0 };
      var bob = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 };   // a few px of inertial lag: gives the card weight
      var gPrev = null;
      window.addEventListener('devicemotion', function (e) {
        if (reduced) return;
        var ax, ay, az, a = e.acceleration;
        if (a && a.x != null) { ax = a.x; ay = a.y; az = a.z || 0; }
        else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
          var g = e.accelerationIncludingGravity;
          if (!gPrev) gPrev = { x: g.x, y: g.y, z: g.z || 0 };
          gPrev.x += (g.x - gPrev.x) * 0.1; gPrev.y += (g.y - gPrev.y) * 0.1; gPrev.z += ((g.z || 0) - gPrev.z) * 0.1;
          ax = g.x - gPrev.x; ay = g.y - gPrev.y; az = (g.z || 0) - gPrev.z;
        } else return;
        if (Math.sqrt(ax * ax + ay * ay + az * az) < 3) return;   // ignore ordinary handling
        var dt = clamp(e.interval ? (e.interval > 1 ? e.interval / 1000 : e.interval) : 0.016, 0.004, 0.1);
        // Side-to-side shakes rock it around its vertical axis; in/out and up/down add a little nod.
        var c = Math.round(Math.cos(snapAngle * DEG)), sn = Math.round(Math.sin(snapAngle * DEG));
        var cxA = ax * c - ay * sn, cyA = ax * sn + ay * c;
        // The card lags the jolt by a hair (tiny shift, mostly depth), then rocks on all three axes.
        bob.vx += -ax * 45 * dt; bob.vy += ay * 45 * dt; bob.vz += -az * 150 * dt;
        wob.vy = clamp(wob.vy - cxA * 380 * dt, -700, 700);
        wob.vz = clamp(wob.vz + cxA * 180 * dt, -350, 350);
        wob.vx = clamp(wob.vx + (cyA * 220 + az * 140) * dt, -450, 450);
      });
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' && !canHover) return;
        setPointer(e);
      }, { passive: true });
      var touching = false;
      var lastType = 'mouse';
      window.addEventListener('pointerdown', function (e) {
        lastType = e.pointerType;
        if (e.target.closest && e.target.closest('a, button')) return;
        if (e.pointerType !== 'mouse') touching = true;
        setPointer(e);
      }, { passive: true });
      function release(e) {
        if (e.pointerType !== 'mouse') {
          touching = false;
          lastPointer = performance.now();
        }
      }
      window.addEventListener('pointerup', release, { passive: true });
      window.addEventListener('pointercancel', release, { passive: true });

      window.addEventListener('deviceorientation', function (e) {
        if (e.gamma == null || e.beta == null) return;
        if (!hasTilt) {
          hasTilt = true;
          btn.hidden = true;
        }
        var b = e.beta * DEG, g = e.gamma * DEG;
        var ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b);
        if (ux * ux + uy * uy > 0.3) {               // ignore when the phone is lying nearly flat
          var phi = Math.atan2(ux, uy) / DEG;
          var off = ((phi - snapAngle) % 360 + 540) % 360 - 180;
          if (Math.abs(off) > 60) {
            snapAngle = ((Math.round(phi / 90) * 90) % 360 + 360) % 360;
            snapChangedAt = performance.now();
            betaRest = e.beta;
          }
        }
        // Measure forward/back tilt relative to how the phone is being held, adapting slowly.
        if (betaRest === null) betaRest = e.beta;
        betaRest += (e.beta - betaRest) * 0.004;
        // Tilt in the card's own frame, so it still makes sense after the card has turned.
        var c = Math.round(Math.cos(snapAngle * DEG)), sn = Math.round(Math.sin(snapAngle * DEG));

        if (sn !== 0 && e.alpha != null) {
          // Sideways: beta/gamma become unreliable near 90 degrees (gimbal lock), so measure the turn
          // from the phone's full 3D orientation instead: how far the card's horizontal edge has swung
          // around the vertical (left/right turn) and how far the screen has tipped up or down.
          var al = e.alpha * DEG, ca = Math.cos(al), sa = Math.sin(al);
          var cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
          var X = [cg * ca - sg * sb * sa, cg * sa + sg * sb * ca, -sg * cb];   // device x in world
          var Y = [-cb * sa, cb * ca, sb];                                     // device y in world
          var Nz = cg * cb;                                                    // screen normal, vertical part
          var th = snapAngle * DEG;
          var rx = Math.cos(th) * X[0] - Math.sin(th) * Y[0];                  // card's horizontal edge in world
          var ry = Math.cos(th) * X[1] - Math.sin(th) * Y[1];
          var hr = Math.atan2(ry, rx) / DEG;
          var el = Math.asin(clamp(Nz, -1, 1)) / DEG;
          if (side.prev === null || side.snap !== snapAngle) {
            side.prev = hr; side.acc = 0; side.rest = 0; side.elRest = el; side.snap = snapAngle;
          }
          side.acc += ((hr - side.prev) % 360 + 540) % 360 - 180;            // unwrapped, so it can keep turning
          side.prev = hr;
          side.rest += (side.acc - side.rest) * 0.004;                         // "straight on" slowly follows you
          side.elRest += (el - side.elRest) * 0.004;
          var turnDeg = side.acc - side.rest, tipDeg = -(el - side.elRest);
          tilt.x = clamp(turnDeg / 25, -1, 1);
          tilt.rawX = turnDeg / 40;
          tilt.y = clamp(tipDeg / 20, -1, 1);
          return;
        }
        side.prev = null;

        var gx = e.gamma / 25, by = (e.beta - betaRest) / 20;
        tilt.x = clamp(gx * c + by * sn, -1, 1);
        tilt.rawX = (e.gamma / 40) * c + by * 0.5 * sn;
        tilt.y = clamp(-gx * sn + by * c, -1, 1);
      });

      // iOS needs a tap before it shares motion data. Only ask if tilt isn't already coming through.
      var DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === 'function' && 'ontouchstart' in window) {
        setTimeout(function () { if (!hasTilt) btn.hidden = false; }, 1200);
        btn.addEventListener('click', function () {
          var DME = window.DeviceMotionEvent;
          if (DME && typeof DME.requestPermission === 'function') DME.requestPermission().catch(function () {});
          DOE.requestPermission().then(function (res) {
            if (res === 'granted') btn.hidden = true;
          }).catch(function () {});
        });
      }

      function render() {
        // Card tilt follows the pointer only (expressed in the card's frame after any quarter turn).
        var th = turn.a * DEG, tc = Math.cos(th), ts = Math.sin(th);
        var cx = cardPose.x * tc + cardPose.y * ts, cy = -cardPose.x * ts + cardPose.y * tc;
        var lift = Math.min(Math.abs(turn.v) * 0.03, 16);   // arcs toward you while turning
        var bank = clamp(turn.v * 0.012, -7, 7);             // and banks a little into the turn
        card.style.transform =
          'translate3d(' + bob.x.toFixed(2) + 'px,' + (cardPose.y * 28 + bob.y).toFixed(2) + 'px,' + (bob.z + lift * 0.6).toFixed(2) + 'px) ' +
          'rotateZ(' + (turn.a + wob.z).toFixed(2) + 'deg) ' +
          'rotateX(' + lift.toFixed(2) + 'deg) ' +
          'rotateY(' + bank.toFixed(2) + 'deg) ' +
          'rotateY(' + (cx * TILT + wob.y).toFixed(2) + 'deg) ' +
          'rotateX(' + (-cy * TILT * 1.25 + wob.x).toFixed(2) + 'deg)';

        // Light and lenticular follow pointer + phone tilt together (and catch the wobble).
        var x = clamp(cx + tiltPose.x + wob.y / 45, -1, 1);
        var y = clamp(cy + tiltPose.y - wob.x / 45, -1, 1);

        sheen.style.backgroundImage = 'linear-gradient(' + (105 + y * 35).toFixed(1) + 'deg, transparent 40%, rgba(255,255,255,' +
          (0.07 + Math.abs(y) * 0.06).toFixed(3) + ') 50%, transparent 60%)';
        sheen.style.backgroundPosition = clamp(50 - x * 60, 0, 100).toFixed(1) + '% ' + clamp(50 - y * 60, 0, 100).toFixed(1) + '%';

        glare.style.background = 'radial-gradient(ellipse 75% 65% at ' + (50 - x * 45).toFixed(1) + '% ' +
          (50 - y * 85).toFixed(1) + '%, rgba(240,205,150,' + (0.06 + Math.abs(y) * 0.07).toFixed(3) + '), transparent 70%)';

        var topLight = 0.04 + Math.max(0, -y) * 0.24;
        var bottomLight = 0.03 + Math.max(0, y) * 0.2;
        edge.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,' + topLight.toFixed(3) + '), inset 0 -1px 0 rgba(255,255,255,' + bottomLight.toFixed(3) + ')';

        app.style.backgroundPosition = '0 ' + (y * 6).toFixed(2) + 'px';

        // Words on a loop (ByteBrew -> App -> Studios -> ByteBrew ...). Each word is clean
        // around its centre; halfway between two words they swap over in strips.
        var lx = cx + (hasTilt ? tiltRaw : tiltPose.x) + wob.y / 45;
        var phase = 1 / 3 + lx * (2 / 3);
        phase -= Math.floor(phase);
        var w = [0, 1 / 3, 2 / 3].map(function (c) {
          var d = Math.abs(phase - c); d = Math.min(d, 1 - d);
          return clamp(0.5 + (1 / 6 - d) / (2 * BLEND), 0, 1);
        });
        var sum = (w[0] + w[1] + w[2]) || 1;
        var start = 0;
        frames.forEach(function (el, i) {
          var a = PERIOD * w[i] / sum, s = start, e = start + a;
          start = e;
          var m = 'repeating-linear-gradient(90deg, transparent 0 ' + s.toFixed(2) + 'px, #000 ' +
            s.toFixed(2) + 'px ' + e.toFixed(2) + 'px, transparent ' + e.toFixed(2) + 'px ' + PERIOD + 'px)';
          el.style.webkitMaskImage = m;
          el.style.maskImage = m;
        });

        var top = w.indexOf(Math.max(w[0], w[1], w[2]));
        if (top !== lastTop) {
          labels.forEach(function (el, i) { el.classList.toggle('on', i === top); });
          lastTop = top;
        }
      }

      var lastNow = performance.now();
      function tick(now) {
        var dt = clamp((now - lastNow) / 1000, 0, 1 / 20);
        lastNow = now;
        // Quarter-turn spring: a little overshoot, then it settles.
        if (shownSnap !== snapAngle && now - snapChangedAt > (reduced ? 0 : SNAP_LAG)) shownSnap = snapAngle;
        var goal = shownSnap + 360 * Math.round((turn.a - shownSnap) / 360);
        for (var i = 0; i < 2; i++) {
          var h = dt / 2, kz = 150, cz = 2 * (reduced ? 1 : 0.55) * Math.sqrt(kz);  // ~0.5 s, one gentle overshoot
          turn.v += (kz * (goal - turn.a) - cz * turn.v) * h;
          turn.a += turn.v * h;
        }
        // Wobble spring: loose, so it rocks a few times before settling.
        for (var j = 0; j < 2; j++) {
          var hh = dt / 2;
          // ~0.5 s period, lightly damped so it rings out naturally (~1 s). Each axis has a slightly different stiffness and
          // damping so they settle at different moments (follow-through), which reads as alive.
          wob.vy += (-150 * wob.y - 2 * 0.27 * Math.sqrt(150) * wob.vy) * hh; wob.y = clamp(wob.y + wob.vy * hh, -24, 24);
          wob.vz += (-200 * wob.z - 2 * 0.31 * Math.sqrt(200) * wob.vz) * hh; wob.z = clamp(wob.z + wob.vz * hh, -10, 10);
          wob.vx += (-175 * wob.x - 2 * 0.35 * Math.sqrt(175) * wob.vx) * hh; wob.x = clamp(wob.x + wob.vx * hh, -14, 14);
          // Positional lag: stiffer and better damped, so it leads and the rotation follows.
          bob.vx += (-300 * bob.x - 2 * 0.45 * Math.sqrt(300) * bob.vx) * hh; bob.x = clamp(bob.x + bob.vx * hh, -4, 4);
          bob.vy += (-300 * bob.y - 2 * 0.45 * Math.sqrt(300) * bob.vy) * hh; bob.y = clamp(bob.y + bob.vy * hh, -4, 4);
          bob.vz += (-240 * bob.z - 2 * 0.42 * Math.sqrt(240) * bob.vz) * hh; bob.z = clamp(bob.z + bob.vz * hh, -14, 14);
        }
        var k = reduced ? 0.2 : 0.09;
        var touchMode = !canHover || lastType !== 'mouse';
        if (touchMode && !touching && now - lastPointer > 3000 && (hasTilt || reduced)) {
          // On phones, a few seconds after the finger lifts, ease the card back to flat
          // so phone tilt reads cleanly again.
          pointer.x = 0;
          pointer.y = 0;
          k = 0.05;
        } else if (!reduced && !hasTilt && !touching && now - lastPointer > 2500) {
          // With no input at all, drift gently so the card never looks frozen.
          pointer.x = Math.sin(now * 0.00028) * 0.9;
          pointer.y = Math.sin(now * 0.00023 + 1) * 0.6;
        }
        cardPose.x += (pointer.x - cardPose.x) * k;
        cardPose.y += (pointer.y - cardPose.y) * k;
        var tx = hasTilt ? tilt.x : 0, ty = hasTilt ? tilt.y : 0;
        tiltPose.x += (tx - tiltPose.x) * 0.12;
        tiltRaw += ((hasTilt ? tilt.rawX : 0) - tiltRaw) * 0.12;
        tiltPose.y += (ty - tiltPose.y) * 0.12;

        var key = cardPose.x.toFixed(3) + ',' + cardPose.y.toFixed(3) + ',' + tiltPose.x.toFixed(3) + ',' + tiltPose.y.toFixed(3) + ',' + turn.a.toFixed(2) + ',' + wob.y.toFixed(2) + ',' + wob.x.toFixed(2) + ',' + wob.z.toFixed(2) + ',' + tiltRaw.toFixed(3) + ',' + bob.x.toFixed(2) + ',' + bob.y.toFixed(2) + ',' + bob.z.toFixed(2);
        if (key !== lastKey) {
          lastKey = key;
          render();
        }
        requestAnimationFrame(tick);
      }

      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
